<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha Mode Поръчка</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link href="css/site.css" rel="stylesheet" />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=am1">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=am1">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=am1">
    <link rel="shortcut icon" href="favicon.ico?v=am1">
    <meta name="theme-color" content="#111827">

</head>
<body>
    <header class="am-header">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="am-logo fs-4" href="/">AlphaMode</a>
            <a class="btn btn-dark rounded-pill px-4" href="order.html">Купи Сега</a>
        </div>
    </header>

    <main role="main" class="pb-3">
        <section class="py-5">
            <div class="container" style="max-width: 820px;">
                <h1 class="mb-4 text-center">Поръчка</h1>

                <form name="order" method="POST" data-netlify="true" action="order-success.html" netlify-honeypot="bot-field">
                    <input type="hidden" name="form-name" value="order" />

                    <!-- Netlify honeypot (hidden from real users, catches bots) -->
                    <p class="d-none">
                        <label>Don't fill this out: <input name="bot-field" /></label>
                    </p>

                    <div class="row g-3">
                        <div class="col-12">
                            <label for="fullName" class="form-label">Име и фамилия</label>
                            <input type="text" name="fullName" id="fullName" class="form-control" required maxlength="80" />
                        </div>

                        <div class="col-12">
                            <label class="form-label">Начин на доставка</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="deliveryMethod" id="dmHome" value="Адрес" checked />
                                    <label class="form-check-label" for="dmHome">Адрес</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="deliveryMethod" id="dmEcont" value="Еконт Офис" />
                                    <label class="form-check-label" for="dmEcont">Еконт Офис или Еконтомат</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="address" class="form-label" id="addressLabel">Адрес за доставка</label>
                            <input type="text" name="address" id="address" class="form-control" required maxlength="200" />
                        </div>

                        <div class="col-12">
                            <label for="town" class="form-label">Град / Населено място</label>
                            <input type="text" name="town" id="town" class="form-control" required maxlength="80" />
                        </div>

                        <div class="col-md-6">
                            <label for="telephone" class="form-label">Телефон</label>
                            <input type="tel" name="telephone" id="telephone" class="form-control" required maxlength="30"
                                   pattern="^(\+?359|0)\d{7,12}$"
                                   title="Въведете валиден български телефонен номер" />
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Имейл</label>
                            <input type="email" name="email" id="email" class="form-control" required maxlength="120" />
                        </div>

                        <div class="col-md-6">
                            <label for="bundleSelect" class="form-label">Количество</label>
                            <select name="bundle" class="form-select" required id="bundleSelect">
                                <option value="">Изберете пакет...</option>
                                <option value="1 опаковка (1 бр.) – 59 лв." data-price="59">1 опаковка (1 бр.) – 59 лв.</option>
                                <option value="2 опаковки (2 бр.) – 100 лв." data-price="100">2 опаковки (2 бр.) – 100 лв.</option>
                                <option value="3 опаковки (3 бр.) – 140 лв." data-price="140">3 опаковки (3 бр.) – 140 лв.</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="promoInput" class="form-label">Промо код</label>
                            <input type="text" name="promoCode" id="promoInput" class="form-control" maxlength="30" />
                            <div id="promoFeedback" class="form-text"></div>
                        </div>
                    </div>

                    <!-- Price summary -->
                    <div class="mt-4 p-3 border rounded bg-light">
                        <div class="d-flex justify-content-between">
                            <span>Цена на пакет:</span>
                            <strong><span id="basePrice">0.00</span> лв</strong>
                        </div>
                        <div id="discountRow" class="d-flex justify-content-between" style="display:none !important;">
                            <span>Отстъпка (<span id="discountPercent">0</span>%)</span>
                            <strong>- <span id="discountAmount">0.00</span> лв</strong>
                        </div>
                        <hr class="my-2" />
                        <div class="d-flex justify-content-between fs-5">
                            <span>Крайна цена:</span>
                            <strong><span id="finalTotal">0.00</span> лв</strong>
                        </div>
                    </div>

                    <!-- Hidden field to capture computed total for the Netlify submission -->
                    <input type="hidden" name="computedTotal" id="computedTotal" value="" />

                    <div class="mt-4">
                        <div class="form-check text-start">
                            <input class="form-check-input" type="checkbox" name="acceptsCodPolicy" id="codPolicy" required />
                            <label class="form-check-label" for="codPolicy">
                                Потвърждавам, че ще получа пратката в срок след пристигането ѝ в офис/на адрес.
                            </label>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button id="submitOrderBtn" type="submit" class="btn btn-dark btn-lg rounded-pill px-5">
                            Потвърди поръчката
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="border-top footer bg-white py-4 mt-4">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <span class="small text-muted">&copy; 2025 — AlphaMode</span>
            <nav class="small">
                <a class="link-dark me-3" href="info/contact.html">Контакти</a>
                <a class="link-dark me-3" href="info/terms.html">Условия</a>
                <a class="link-dark me-3" href="info/returns.html">Връщане</a>
                <a class="link-dark" href="info/delivery.html">Доставка</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/order.js"></script>
</body>
</html>
